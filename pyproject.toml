[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curate-next"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ============================================================
# Pytest + coverage
# ============================================================

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["src/curate_next/tests"]
pythonpath = ["src"]

addopts = [
  "--cov=curate_next",
  "--cov-report=term-missing",
  "--cov-report=html",
]

[tool.coverage.run]
branch = true
source = ["curate_next"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ============================================================
# Optional dependencies
# ============================================================

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-benchmark",
]

treesitter = [
  "tree-sitter>=0.25",
  "tree-sitter-python>=0.25",
]
