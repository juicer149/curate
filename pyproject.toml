[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# ============================================================
# Project metadata
# ============================================================

[project]
name = "curate"
version = "0.3.0"
description = "Curate — structural intermediate representation for source code"
requires-python = ">=3.10"
dependencies = []

# Optional but recommended
authors = [
  { name = "Albin" }
]
readme = "README.md"

[project.scripts]
curate = "curate.__main__:main"

# ============================================================
# Packaging (src-layout)
# ============================================================

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

# ============================================================
# Pytest configuration
# ============================================================

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]

markers = [
  "treesitter: tests that require tree-sitter and language bindings",
]

addopts = [
  "--cov=curate",
  "--cov-report=term-missing",
  "--cov-report=html",
]

# ============================================================
# Coverage configuration
# ============================================================

[tool.coverage.run]
branch = true
source = ["curate"]

[tool.coverage.report]
show_missing = true
skip_covered = false

# ============================================================
# Optional dependencies
# ============================================================

[project.optional-dependencies]

dev = [
  "pytest",
  "pytest-cov",
  "pytest-benchmark",
  "ptpython",
]

treesitter = [
  "tree-sitter>=0.25",
  "tree-sitter-python>=0.25",
]
